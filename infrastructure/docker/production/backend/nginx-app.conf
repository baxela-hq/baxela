# Embedded web server for the backend container: serves public/ directly
# and runs the front controller through the local PHP-FPM pool (:9000).
# Reached only by backend-nginx over the isolated proxy network (:8000).
# gzip is left off — the outer proxy compresses once, at the edge.

server {
    listen 8000;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Uploads: PHP allows post_max_size=22M; nginx must not cut smaller.
    client_max_body_size 22m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The Laravel front controller. Exact-match beats the PHP-deny regex
    # below, so the framework is reachable while every other PHP path is
    # rejected.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Preserve the forwarding chain backend-nginx built instead of this
        # server's own client-facing values: Laravel's trusted-proxy walk
        # needs the chain from the outer proxy (client, edge, ...), with
        # backend-nginx's address appended as the most recent hop. The
        # explicit params also replace any client-supplied X-Forwarded-*
        # the automatic header passthrough would otherwise relay untouched.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Uploaded PHP must never execute or be disclosed as source: reject at
    # nginx so an existing /storage/x.php never reaches PHP-FPM.
    location ~* \.(?:php[0-9]?|phtml|phar)(?:$|/) {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /dev/stderr;
    access_log /dev/stdout;
}
