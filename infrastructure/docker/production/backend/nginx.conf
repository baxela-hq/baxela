server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    server_tokens off;

    # Baseline security headers; TLS/HSTS is terminated at the edge proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb websocket endpoint: browsers connect to
    # /app/{REVERB_APP_KEY} on the same host as the API.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Websockets are long-lived; keep idle connections open past the
        # default 60s proxy timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ \.php$ {
        # Only serve real .php files: without this, a request such as
        # /storage/<uploaded-file>/x.php could reach PHP-FPM for a file that
        # does not exist as-is (uploaded-file-executed-as-PHP vector).
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
