server {
    listen 80;
    server_name _;

    server_tokens off;

    # Baseline security headers; TLS/HSTS is terminated at the edge proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: PHP allows post_max_size=22M; nginx must not cut smaller.
    client_max_body_size 22m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The backend service advertises `backend-upstream` ONLY on the isolated
    # `proxy` network (see docker-compose.prod.yml), so this upstream is
    # guaranteed to be the Octane/RoadRunner HTTP listener reached over that
    # network — the source IP Laravel sees must match TRUSTED_PROXIES
    # (172.28.0.0/29). Runtime DNS via Docker's embedded resolver: a
    # recreated backend container gets a new IP and nginx picks it up
    # without a reload.
    #
    # Pure reverse proxy: this container has no application files mounted,
    # so every request (including public static files, which RoadRunner
    # serves via its static middleware from public_path()) goes to the app.
    # The former fastcgi split could never have worked here — its
    # `try_files $uri =404` ran against this container's empty filesystem.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $octane_upstream backend-upstream:8000;

    location / {
        # No URI part after the host: the original request URI is passed
        # through untouched (required behavior for the API).
        proxy_pass http://$octane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverb websocket endpoint: browsers connect to
    # /app/{REVERB_APP_KEY} on the same host as the API.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Websockets are long-lived; keep idle connections open past the
        # default 60s proxy timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
