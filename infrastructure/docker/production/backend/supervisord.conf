; Process manager for the backend container: php-fpm + nginx under one
; supervisor so the outer backend-nginx proxy keeps a single HTTP upstream
; (:8000) and static files are served by an nginx that actually has the
; application files.
;
; Both masters run as root (supervisord is what the image CMD starts) so
; php-fpm can drop pool workers to www-data and nginx can drop its own
; workers; the compose service still applies security_opt
; no-new-privileges. Logs go to stdout/stderr and ride the container log
; stream (json-file rotation configured in docker-compose.prod.yml).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
; QUIT drains in-flight requests before the master exits.
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
