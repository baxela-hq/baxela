; Production overrides — opcache tuned for immutable images (code never
; changes in place, so timestamp validation is turned off).
memory_limit=256M
upload_max_filesize=20M
post_max_size=20M

; --- Hardening ---------------------------------------------------------------
; Never advertise the PHP version or render error pages to the caller.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
; A request such as /storage/<uploaded-file>/x.php must not execute; nginx
; also guards this with try_files, this is defense in depth.
cgi.fix_pathinfo=0

; Session cookie hardening (the API is bearer-token based, so this mostly
; covers any session-using edge such as the web guard).
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
