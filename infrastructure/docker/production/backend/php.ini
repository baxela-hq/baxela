; Production overrides — opcache tuned for immutable images (code never
; changes in place, so timestamp validation is turned off).
; post_max_size sits above upload_max_filesize to cover multipart encoding
; overhead; nginx's client_max_body_size must be >= post_max_size.
memory_limit=256M
upload_max_filesize=20M
post_max_size=22M

; Container env vars (env_file) are the app's configuration — the image
; ships no .env file. EGPCS populates $_ENV/$_SERVER from the environment
; so Laravel's env layer can read them (the php.ini-production template
; ships GPCS, which would hide the environment from requests).
variables_order=EGPCS

; --- Hardening ---------------------------------------------------------------
; Never advertise the PHP version or render error pages to the caller.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
; A request such as /storage/<uploaded-file>/x.php must not execute; the
; nginx vhost rejects PHP paths outright (404) before they reach a worker.
; fix_pathinfo=0 is pure defense in depth for any direct .php hit.
cgi.fix_pathinfo=0

; Session cookie hardening (the API is bearer-token based, so this mostly
; covers any session-using edge such as the web guard).
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax

opcache.enable=1
; The CLI SAPI only runs artisan one-shots here (queue, scheduler, migrate)
; — keep its opcache off. FPM workers are covered by opcache.enable above.
; validate_timestamps stays off: production images are immutable.
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
