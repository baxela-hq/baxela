; Production overrides — opcache tuned for immutable images (code never
; changes in place, so timestamp validation is turned off).
; post_max_size sits above upload_max_filesize to cover multipart encoding
; overhead; nginx's client_max_body_size must be >= post_max_size.
memory_limit=256M
upload_max_filesize=20M
post_max_size=22M

; --- Hardening ---------------------------------------------------------------
; Never advertise the PHP version or render error pages to the caller.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
; A request such as /storage/<uploaded-file>/x.php must not execute; the
; nginx vhost rejects PHP paths outright (404) before they reach a worker.
; Under RoadRunner there is no FastCGI PATH_INFO handling, so this is pure
; defense in depth.
cgi.fix_pathinfo=0

; Session cookie hardening (the API is bearer-token based, so this mostly
; covers any session-using edge such as the web guard).
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax

opcache.enable=1
; RoadRunner workers are spawned via the PHP CLI SAPI (`server.command=php,
; vendor/bin/roadrunner-worker`), so CLI opcache must be ON or every worker
; pays a full compile on boot. validate_timestamps stays off: production
; images are immutable.
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
