; fpm pool overrides for the backend container. The embedded nginx
; fastcgi-passes to 127.0.0.1:9000, which the pool's default listener
; (:9000) already covers.
;
; clear_env=no keeps the container's environment (the env_file variables)
; visible to fpm workers — Laravel reads its configuration from them, the
; image ships no .env file.
;
; The stock process manager stays (dynamic, 5 children) — comparable
; capacity to the previous 4-worker app server; tune here when measured
; load demands it.
[www]
clear_env = no
