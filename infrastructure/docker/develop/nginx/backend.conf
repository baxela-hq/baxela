server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Baseline security headers (develop parity with production confs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: PHP allows post_max_size=22M; nginx must not cut smaller.
    client_max_body_size 22m;

    # The app service advertises `app-upstream` ONLY on the isolated `proxy`
    # network (see docker-compose.yml), so this upstream is guaranteed to be
    # the Octane/RoadRunner HTTP listener reached over that network — the
    # source IP Laravel sees must match TRUSTED_PROXIES (172.28.0.0/29).
    # Runtime DNS via Docker's embedded resolver: a recreated app container
    # gets a new IP and nginx picks it up without a reload (a static
    # proxy_pass would cache the old IP until restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $octane_upstream app-upstream:8000;

    # The Laravel front controller, proxied to Octane. Exact-match beats the
    # PHP-deny regex below, so the framework is reachable while every other
    # PHP path is rejected.
    location = /index.php {
        try_files /not_exists @octane;
    }

    # Existing public files (favicon, /storage uploads via the relative
    # symlink, built assets) are served directly; everything else goes to
    # Octane. Unmatched requests therefore ride the full Laravel pipeline.
    location / {
        try_files $uri $uri/ @octane;
    }

    # Uploaded PHP must never execute or be disclosed as source. This is
    # strictly stronger than the previous fpm setup, where an existing
    # /storage/x.php reached PHP-FPM and would have executed.
    location ~* \.(?:php[0-9]?|phtml|phar)(?:$|/) {
        return 404;
    }

    location @octane {
        # No URI part after the host: the original request URI is passed
        # through untouched (required behavior for the API).
        proxy_pass http://$octane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
