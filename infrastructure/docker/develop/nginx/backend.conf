server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Baseline security headers (develop parity with production confs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: PHP allows post_max_size=22M; nginx must not cut smaller.
    client_max_body_size 22m;

    # The app service advertises `app-upstream` ONLY on the isolated `proxy`
    # network (see docker-compose.yml), so this upstream is guaranteed to be
    # the backend's PHP-FPM pool reached over that network — the source IP
    # Laravel sees must match TRUSTED_PROXIES (172.28.0.0/29). Runtime DNS
    # via Docker's embedded resolver: a recreated app container gets a new
    # IP and nginx picks it up without a reload (a static fastcgi_pass
    # would cache the old IP until restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_upstream app-upstream:9000;

    # Existing public files (favicon, /storage uploads via the relative
    # symlink, built assets) are served directly; everything else goes to
    # the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The Laravel front controller. Exact-match beats the PHP-deny regex
    # below, so the framework is reachable while every other PHP path is
    # rejected.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # nginx is the ONLY trusted proxy: hand Laravel the connection's
        # real client ($remote_addr) and scheme instead of relaying the
        # client's own forwarded headers (the automatic header passthrough
        # would otherwise forward a spoofable X-Forwarded-* untouched).
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # Uploaded PHP must never execute or be disclosed as source. This is
    # strictly stronger than a try_files guard inside the php location: an
    # existing /storage/x.php is rejected at nginx, never reaching PHP-FPM.
    location ~* \.(?:php[0-9]?|phtml|phar)(?:$|/) {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
