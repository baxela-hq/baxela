# Production environment (single-server deploy): backend fpm + nginx,
# dedicated one-shot migrate, queue worker, scheduler, admin SPA,
# MySQL and Redis. Build contexts are the repo root, so both images are
# self-contained and reusable as-is in Kubernetes later.
#
# Run from the repo root:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# NOTE: a bare `docker compose up -d` (without -f) starts the DEVELOPMENT
# stack — always pass --env-file and -f in production.

name: baxela-production

x-backend: &backend
    image: baxela/backend:production
    build:
        context: .
        dockerfile: infrastructure/docker/production/backend/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy
        migrate:
            condition: service_completed_successfully

services:
    backend:
        <<: *backend

    backend-nginx:
        image: nginx:stable-bookworm
        restart: unless-stopped
        ports:
            - "${BACKEND_PORT:-8080}:80"
        volumes:
            - ./infrastructure/docker/production/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - backend

    # One-shot: fpm/queue/scheduler wait for this to complete, so they never
    # race migrations against each other.
    migrate:
        <<: *backend
        command: php artisan migrate --force
        restart: "no"
        depends_on:
            mysql:
                condition: service_healthy

    queue:
        <<: *backend
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

    scheduler:
        <<: *backend
        command: php artisan schedule:work

    admin:
        image: baxela/admin:production
        build:
            context: .
            dockerfile: infrastructure/docker/production/admin/Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL}
                VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
                VITE_STORE_FRONT_URL: ${VITE_STORE_FRONT_URL}
        restart: unless-stopped
        ports:
            - "${ADMIN_PORT:-8081}:80"

    mysql:
        image: mysql:8-debian
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.production}
            MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.production}
            MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20
        # No published port by default. Reach the DB via the compose network,
        # or publish one explicitly if you need host access.

    redis:
        image: redis:7-bookworm
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    mysql-data:
    redis-data:
