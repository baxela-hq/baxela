<!doctype html>
<!-- Default UI language/direction (fa/RTL) so the first paint matches the
     app default; React applies the stored default language and any manual
     direction override right after boot. -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Baxela Admin</title>
    <meta name="title" content="Baxela Admin" />
    <meta
      name="description"
      content="Baxela admin panel for managing catalog, orders, users, and content."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Baxela Admin" />
    <meta
      property="og:description"
      content="Baxela admin panel for managing catalog, orders, users, and content."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Baxela Admin" />
    <meta
      property="twitter:description"
      content="Baxela admin panel for managing catalog, orders, users, and content."
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    /> -->

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
