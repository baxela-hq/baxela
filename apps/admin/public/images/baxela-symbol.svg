<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Baxela">
  <!--
    Baxela symbol — the parcel.
    An isometric box built from flat stripes: hexagon frame band + two
    kinked tape bands wrapping the faces (Evershop-style construction),
    single flat Persian turquoise.
  -->
  <path
    fill="#16A8B1"
    fill-rule="evenodd"
    d="M 48,6 L 90,29 L 90,68 L 48,91 L 4,68 L 4,29 Z
       M 48,17.3 L 78.9,34.2 L 78.9,62.8 L 48,79.7 L 17.1,62.8 L 17.1,34.2 Z"
  />
  <path fill="#16A8B1" d="M 4,38 L 48,61 L 90,38 L 90,47 L 48,70 L 4,47 Z" />
  <path fill="#16A8B1" d="M 4,53 L 48,76 L 90,53 L 90,62 L 48,85 L 4,62 Z" />
</svg>
