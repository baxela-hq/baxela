:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground);

h3 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
.text-small { font-size: 12px; }
.text-muted { color: var(--muted-foreground); }
.tabular-nums { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;

.viz-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 8px 0; }
.form-label { font-size: 12px; color: var(--muted-foreground); }
.form-range { accent-color: var(--viz-series-1); vertical-align: middle; }

  background: var(--popover); color: var(--foreground); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; opacity: 0; transition: opacity 120ms; }
code { font-family: ui-monospace, monospace; font-size: 12px;
  background: var(--muted); border-radius: 4px; padding: 1px 5px; }
</style>
</head>

        DATA.nodes.forEach(function (n) {
          n.x = Math.max(pad, Math.min(w - pad, n.x));
          n.y = Math.max(pad, Math.min(h - pad, n.y));
        });
        draw();
      });
    if (reduceMotion) { sim.stop(); sim.tick(300); draw(); }
  }

  function draw() {
    linkSel.attr('x1', function (d) { return d.source.x; }).attr('y1', function (d) { return d.source.y; })
      .attr('x2', function (d) { return d.target.x; }).attr('y2', function (d) { return d.target.y; });
    nodeSel.attr('transform', function (d) { return 'translate(' + d.x + ',' + d.y + ')'; });
  }

  function shapePath(d) {
    var r = rScale(d.symbols);
    if (d.app === 'backend') return null;
    if (d.app === 'admin') {
      var s = r * 1.55;
      return 'M' + (-s / 2) + ',' + (-s / 2) + ' h' + s + ' a' + (r * 0.32) + ',' + (r * 0.32) + ' 0 0 1 ' + (r * 0.32) + ',' + (r * 0.32) +
        ' v' + (s - r * 0.64) + ' a' + (r * 0.32) + ',' + (r * 0.32) + ' 0 0 1 ' + (-r * 0.32) + ',' + (r * 0.32) +
        ' h' + (-s) + ' a' + (r * 0.32) + ',' + (r * 0.32) + ' 0 0 1 ' + (-r * 0.32) + ',' + (-r * 0.32) +
        ' v' + (-(s - r * 0.64)) + ' a' + (r * 0.32) + ',' + (r * 0.32) + ' 0 0 1 ' + (r * 0.32) + ',' + (-r * 0.32) + ' z';
    }
    var q = r * 1.25;
    return 'M0,' + (-q) + ' L' + q + ',0 L0,' + q + ' L' + (-q) + ',0 Z';
  }

  function update(relayout) {
    var visLinks = DATA.links.filter(visibleLink);
    var visNodes = DATA.nodes.filter(function (n) { return activeApps.has(n.app); });

    linkSel = gLinks.selectAll('line').data(visLinks, function (d) { return d.source.id + '->' + d.target.id; });
    linkSel.exit().remove();
    linkSel = linkSel.enter().append('line')
      .attr('class', 'cg-link')
      .attr('data-tooltip', function (d) {
        return d.source.mod + ' -> ' + d.target.mod + ': ' + fmt(d.value) + ' refs (' + d.kinds + ' kinds)';
      })
      .merge(linkSel)
      .attr('stroke-width', function (d) { return Math.min(5, 0.8 + Math.sqrt(d.value) / 3.2); });

    nodeSel = gNodes.selectAll('g.cg-node').data(visNodes, function (d) { return d.id; });
    nodeSel.exit().remove();
    var enter = nodeSel.enter().append('g').attr('class', 'cg-node cursor-interaction');
    enter.append(function (d) {
        return document.createElementNS('http://www.w3.org/2000/svg',
          d.app === 'backend' ? 'circle' : 'path');
      })
      .attr('class', function (d) { return 'cg-shape cg-app-' + d.app; })
      .attr('data-tooltip', tipText);
    enter.filter(function (d) { return d.app === 'backend'; })
      .select('circle').attr('r', function (d) { return rScale(d.symbols); });
    enter.append('text')
      .attr('class', 'cg-label')
      .attr('text-anchor', 'middle')
      .attr('dy', function (d) { return rScale(d.symbols) + 14; })
      .text(function (d) { return d.mod; });
    nodeSel = enter.merge(nodeSel);
    nodeSel.select('circle').attr('r', function (d) { return rScale(d.symbols); });
    nodeSel.select('path.cg-shape').attr('d', shapePath);
    nodeSel.select('text.cg-label').attr('dy', function (d) { return rScale(d.symbols) + 14; });

    nodeSel
      .on('mouseenter', function (e, d) { highlight(d); })
      .on('mouseleave', function () { highlight(null); });

    if (relayout) layout(false);
    if (reduceMotion && !sim) draw();
  }

  function highlight(d) {
    var conn = {};
    if (d) {
      conn[d.id] = true;
      DATA.links.forEach(function (l) {
        if (l.source.id === d.id) conn[l.target.id] = true;
        if (l.target.id === d.id) conn[l.source.id] = true;
      });
    }
    g.classed('cg-dim', !!d);
    linkSel.classed('cg-on', d ? function (l) { return l.source.id === d.id || l.target.id === d.id; } : false);
    nodeSel.classed('cg-on', d ? function (n) { return !!conn[n.id]; } : false);
  }

  minInput.addEventListener('input', function () {
    minLabel.textContent = minInput.value;
    update(true);
  });

  svg.call(d3.zoom().scaleExtent([0.4, 4]).on('zoom', function (e) { g.attr('transform', e.transform); }));

  var desc = 'Graph of ' + DATA.nodes.length + ' modules and ' + DATA.links.length +
    ' cross-module reference links. Strongest: ' + strongest.source.mod + ' -> ' +
    strongest.target.mod + ' with ' + fmt(strongest.value) + ' references.';
  document.getElementById('cg-desc').textContent = desc;
  document.getElementById('cg-summary').textContent =
    DATA.nodes.length + ' modules | ' + fmt(DATA.links.length) + ' cross-module links | aggregated from the codegraph index (imports, calls, references, extends)';

  update(false);
  layout(true);
  if (reduceMotion) draw();

  if (typeof ResizeObserver !== 'undefined') {
    var ro = new ResizeObserver(function () {
      if (Math.abs((svg.property('__w') || 0) - width()) > 8) layout(false);
    });
    ro.observe(stage);
  }
})();
</script>
<style>
#cg-dep-graph .cg-app-backend { fill: var(--viz-series-1); stroke: var(--border); }
#cg-dep-graph .cg-app-admin { fill: var(--viz-series-2); stroke: var(--border); }
#cg-dep-graph .cg-app-storefront { fill: var(--viz-series-3); stroke: var(--border); }
#cg-dep-graph .cg-shape { fill-opacity: 0.3; stroke-width: 1.5; }
#cg-dep-graph .cg-link { stroke: var(--border); stroke-opacity: 0.55; }
#cg-dep-graph .cg-label { fill: var(--foreground); font-size: 12px; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-opacity: 0.85; }
#cg-dep-graph .cg-dim .cg-link { stroke-opacity: 0.06; }
#cg-dep-graph .cg-dim .cg-node { opacity: 0.15; }
#cg-dep-graph .cg-dim .cg-node.cg-on { opacity: 1; }
#cg-dep-graph .cg-dim .cg-link.cg-on { stroke-opacity: 0.9; stroke: var(--viz-series-1); }
#cg-dep-graph .cg-leg { background: transparent; border: none; color: var(--foreground); padding: 2px 8px; font: inherit; }
#cg-dep-graph .cg-leg[aria-pressed="false"] { color: var(--muted-foreground); opacity: 0.6; }
#cg-dep-graph .cg-sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; fill-opacity: 0.6; }
#cg-dep-graph .cg-sw.cg-app-backend { background: var(--viz-series-1); }
#cg-dep-graph .cg-sw.cg-app-admin { background: var(--viz-series-2); }
#cg-dep-graph .cg-sw.cg-app-storefront { background: var(--viz-series-3); }
</style>

<script>
(function () {
  var tip = document.createElement('div');
  tip.id = 'cg-tip';
  tip.setAttribute('role', 'tooltip');
  document.body.appendChild(tip);
  var current = null;
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest && e.target.closest('[data-tooltip]');
    if (!t || t === current) return;
    current = t;
    tip.textContent = t.getAttribute('data-tooltip');
    tip.style.opacity = '1';
    var r = t.getBoundingClientRect();
    var x = Math.min(window.innerWidth - 350, Math.max(8, r.left + r.width / 2 - 120));
    var y = r.top - 8 - tip.getBoundingClientRect().height;
    tip.style.left = x + window.scrollX + 'px';
    tip.style.top = Math.max(4, y + window.scrollY) + 'px';
  });
  document.addEventListener('mouseout', function (e) {
    var rel = e.relatedTarget;
    var next = rel && rel.closest ? rel.closest('[data-tooltip]') : null;
    if (current && next !== current) {
      current = null; tip.style.opacity = '0';
    }
  });
})();
</script>
</body>
</html>
