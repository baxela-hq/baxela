name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuses the repo's own POSIX commit-msg hook (.githooks/commit-msg), the
  # same spec developers enforce locally — docs/COMMIT_CONVENTION.md.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate every commit subject (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE_SHA"
          status=0
          for sha in $(git rev-list --no-merges "$base"..HEAD); do
            subject="$(git log -1 --format=%s "$sha")"
            printf '%s\n' "$subject" > /tmp/commit-msg
            if ! sh .githooks/commit-msg /tmp/commit-msg; then
              echo "::error::Invalid commit subject: $subject"
              status=1
            fi
          done
          exit $status

      - name: Validate head commit subject (push)
        if: github.event_name == 'push'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -n 1 > /tmp/commit-msg
          sh .githooks/commit-msg /tmp/commit-msg

  # Cross-locale translation parity (missing/extra keys & files) plus
  # storefront loader registration — dependency-free Node script.
  i18n-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check translation parity
        run: node scripts/check-i18n-parity.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd, redis, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The Google sign-in nonce store is deliberately Redis-backed and
      # fails closed when Redis is unreachable; its Lua passthrough
      # speaks the phpredis eval order, so the suite needs the extension
      # plus a live Redis. A plain step container (not a job service —
      # those died at setup on this runner) maps 6378 -> 6379, the
      # develop stack's host port.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6378:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping 2>/dev/null | grep -q PONG && exit 0
            sleep 2
          done
          echo "::error::Redis did not become healthy"
          exit 1

      # Pest against SQLite :memory: — env comes from phpunit.xml, except
      # Redis: a real env var outranks any phpunit.xml entry. On failure,
      # the failed tests are echoed as annotations — the raw job log
      # needs auth to read, annotations don't.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pest 2>&1 | tee /tmp/pest.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::$(grep -a 'FAILED' /tmp/pest.log | head -20 | tr '\n' ' ' || true)"
            echo "::error::tail: $(tail -c 1500 /tmp/pest.log | tr '\n' ' ')"
          fi
          exit $rc
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6378'

      # The PostgreSQL leg (postgres-migration DD11): the FULL suite runs
      # against a real postgres:18 — same step-container pattern as Redis
      # (job services died at setup on this runner). Real env vars outrank
      # the phpunit.xml sqlite entries, so one phpunit.xml serves both legs.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres             -e POSTGRES_DB=baxela_test             -e POSTGRES_USER=baxela             -e POSTGRES_PASSWORD=password             -p 5432:5432 postgres:18-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U baxela -d baxela_test 2>/dev/null | grep -q accepting && exit 0
            sleep 2
          done
          echo "::error::PostgreSQL did not become healthy"
          exit 1

      - name: Run tests (PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pest 2>&1 | tee /tmp/pest-pg.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::$(grep -a 'FAILED' /tmp/pest-pg.log | head -20 | tr '\n' ' ' || true)"
            echo "::error::tail: $(tail -c 1500 /tmp/pest-pg.log | tr '\n' ' ')"
          fi
          exit $rc
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6378'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: baxela_test
          DB_USERNAME: baxela
          DB_PASSWORD: password

      - name: Export OpenAPI document
        run: php artisan scramble:export

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi
          path: apps/backend/api.json
          retention-days: 30

  # Larastan against the committed baseline — fails on any error the
  # baseline doesn't already cover, so the baseline only ever shrinks.
  phpstan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build IS the typecheck (tsc -b && vite build)
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/storefront/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Secrets scan — full git history on every push. Runs the gitleaks
  # binary directly (pinned image): gitleaks/gitleaks-action requires a
  # paid license for organization accounts. Known historical test fixtures
  # are pinned by fingerprint in .gitleaksignore (see SECURITY.md).
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --exit-code 1
