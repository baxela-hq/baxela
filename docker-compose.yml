# Development environment (default compose file): php-fpm + nginx + MySQL +
# Redis, with the backend source bind-mounted from apps/backend (no host PHP
# required), plus the admin and storefront dev servers behind the `frontend`
# profile (enabled by default via COMPOSE_PROFILES in .env.example). Run from
# the repo root: docker compose up -d
#
# Variables come from .env at the repo root (see .env.example).

name: baxela-develop

# Container log rotation: cap json-file logs (~30 MB per service) so they
# can't grow unbounded — the Docker daemon default keeps everything forever.
# This governs container stdout/stderr only; Laravel's own file retention is
# separate (LOG_DAILY_DAYS in apps/backend/.env).
x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    app:
        logging: *default-logging
        build:
            context: ./infrastructure/docker/develop/backend
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/backend:develop
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./apps/backend:/var/www/html
        environment:
            WWWUSER: ${WWWUSER:-1000}
            WWWGROUP: ${WWWGROUP:-1000}
            # Server→Reverb broadcasts stay on the compose network; the
            # REVERB_HOST in apps/backend/.env is the browser-facing host.
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            # Sole migration owner among the backend containers: the shared
            # entrypoint only runs `artisan migrate` when this is set, so a
            # queue/reverb restart can't race a `module:migrate-fresh` that
            # just wiped the database.
            RUN_MIGRATIONS: 1
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Mirrors the production stack's worker so queued notifications (and
    # anything else on the database queue) process locally too.
    queue:
        logging: *default-logging
        image: baxela/backend:develop
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - ./apps/backend:/var/www/html
        environment:
            WWWUSER: ${WWWUSER:-1000}
            WWWGROUP: ${WWWGROUP:-1000}
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        depends_on:
            app:
                condition: service_started

    # Laravel Reverb websocket server: the backend broadcasts through it
    # and both SPAs connect to it for realtime notifications. Same image
    # and bind-mount as the app service, so it reads apps/backend/.env.
    reverb:
        logging: *default-logging
        image: baxela/backend:develop
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0
        volumes:
            - ./apps/backend:/var/www/html
        ports:
            - "${REVERB_DEV_PORT:-8080}:8080"
        depends_on:
            app:
                condition: service_started

    web:
        logging: *default-logging
        image: nginx:stable-bookworm
        restart: unless-stopped
        ports:
            - "${BACKEND_APP_PORT:-8085}:80"
        volumes:
            - ./apps/backend:/var/www/html
            - ./infrastructure/docker/develop/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        # /up goes through php-fpm into Laravel, so healthy means the whole
        # request path works (the app entrypoint bootstraps it on first run).
        healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost/up || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    admin:
        logging: *default-logging
        build:
            context: ./infrastructure/docker/develop/admin
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/admin:develop
        profiles:
            - frontend
        # The image runs as a uid-matched `node` user, which keeps host file
        # ownership correct on a rootful engine. Under rootless Docker that
        # matching is shifted by the user namespace and the bind mount reads
        # as root-owned, so run as container root (= the host user there).
        user: "0:0"
        restart: unless-stopped
        working_dir: /app
        ports:
            - "${ADMIN_DEV_PORT:-5173}:5173"
        volumes:
            - ./apps/admin:/app
            - /app/node_modules
        environment:
            # The browser runs on the host, so the API URL must be
            # host-reachable — compose service names don't resolve there.
            VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_APP_PORT:-8085}/api/v1}
            VITE_STORE_FRONT_URL: ${VITE_STORE_FRONT_URL:-http://localhost:${STOREFRONT_DEV_PORT:-3000}}
            # Reverb websocket (realtime notifications); same host/port the
            # browser reaches the reverb service on.
            VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-baxela-local-key}
            VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
            VITE_REVERB_PORT: ${REVERB_DEV_PORT:-8080}
            VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
            # Sentry browser SDK; empty by default (SDK stays disabled).
            VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        depends_on:
            - web
            - reverb

    storefront:
        logging: *default-logging
        build:
            context: ./infrastructure/docker/develop/storefront
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/storefront:develop
        profiles:
            - frontend
        # See the admin service: container root maps to the host user under
        # rootless Docker, which the image's uid-matched user does not.
        user: "0:0"
        restart: unless-stopped
        working_dir: /app
        command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0"]
        ports:
            - "${STOREFRONT_DEV_PORT:-3000}:3000"
        volumes:
            - ./apps/storefront:/app
            - /app/node_modules
            - /app/.next
        environment:
            # Browser fetches go through the host-published backend port;
            # SSR fetches run inside the compose network and use the nginx
            # service directly.
            NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_APP_PORT:-8085}/api/v1}
            SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://web:80/api/v1}
            # Reverb websocket (realtime notifications).
            NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-baxela-local-key}
            NEXT_PUBLIC_REVERB_HOST: ${REVERB_HOST:-localhost}
            NEXT_PUBLIC_REVERB_PORT: ${REVERB_DEV_PORT:-8080}
            NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_SCHEME:-http}
            # Public origin for sitemap.xml/robots.txt/metadataBase (server-only).
            SITE_URL: ${SITE_URL:-http://localhost:${STOREFRONT_DEV_PORT:-3000}}
            # Sentry: NEXT_PUBLIC_* feeds the browser SDK (and the CSP
            # connect-src derivation) at dev-serve time; SENTRY_DSN is the
            # server-side runtime DSN. Both empty by default (SDK disabled).
            NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
            SENTRY_DSN: ${SENTRY_DSN:-}
        depends_on:
            - web
            - reverb

    mysql:
        logging: *default-logging
        image: mysql:8-debian
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DEV_DB_DATABASE:-baxela_backend}
            MYSQL_USER: ${DEV_DB_USERNAME:-baxela}
            MYSQL_PASSWORD: ${DEV_DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
        ports:
            # Loopback only: an unauthenticated dev Redis / weak-password dev
            # MySQL must not be reachable from the network.
            - "127.0.0.1:${BACKEND_MYSQL_PORT:-3308}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        logging: *default-logging
        image: redis:7-bookworm
        restart: unless-stopped
        ports:
            - "127.0.0.1:${BACKEND_REDIS_PORT:-6378}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    mail:
        logging: *default-logging
        image: axllent/mailpit
        profiles:
            - mail
        restart: unless-stopped
        ports:
            - "${MAILPIT_PORT:-8025}:8025"

volumes:
    mysql-data:
    redis-data:
