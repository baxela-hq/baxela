# Development environment (default compose file): php-fpm + nginx + MySQL +
# Redis, with the backend source bind-mounted from apps/backend (no host PHP
# required), plus the admin and storefront dev servers behind the `frontend`
# profile (enabled by default via COMPOSE_PROFILES in .env.example). Run from
# the repo root: docker compose up -d
#
# Variables come from .env at the repo root (see .env.example).

name: baxela-develop

services:
    app:
        build:
            context: ./infrastructure/docker/develop/backend
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/backend:develop
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./apps/backend:/var/www/html
        environment:
            WWWUSER: ${WWWUSER:-1000}
            WWWGROUP: ${WWWGROUP:-1000}
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        image: nginx:stable-bookworm
        restart: unless-stopped
        ports:
            - "${BACKEND_APP_PORT:-8085}:80"
        volumes:
            - ./apps/backend:/var/www/html
            - ./infrastructure/docker/develop/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        # /up goes through php-fpm into Laravel, so healthy means the whole
        # request path works (the app entrypoint bootstraps it on first run).
        healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost/up || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    admin:
        build:
            context: ./infrastructure/docker/develop/admin
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/admin:develop
        profiles:
            - frontend
        restart: unless-stopped
        working_dir: /app
        ports:
            - "${ADMIN_DEV_PORT:-5173}:5173"
        volumes:
            - ./apps/admin:/app
            - /app/node_modules
        environment:
            # The browser runs on the host, so the API URL must be
            # host-reachable — compose service names don't resolve there.
            VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_APP_PORT:-8085}/api/v1}
            VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
            VITE_STORE_FRONT_URL: ${VITE_STORE_FRONT_URL:-http://localhost:${STOREFRONT_DEV_PORT:-3000}}
        depends_on:
            - web

    storefront:
        build:
            context: ./infrastructure/docker/develop/storefront
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        image: baxela/storefront:develop
        profiles:
            - frontend
        restart: unless-stopped
        working_dir: /app
        command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0"]
        ports:
            - "${STOREFRONT_DEV_PORT:-3000}:3000"
        volumes:
            - ./apps/storefront:/app
            - /app/node_modules
            - /app/.next
        environment:
            # Browser fetches go through the host-published backend port;
            # SSR fetches run inside the compose network and use the nginx
            # service directly.
            NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_APP_PORT:-8085}/api/v1}
            SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://web:80/api/v1}
        depends_on:
            - web

    mysql:
        image: mysql:8-debian
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DEV_DB_DATABASE:-xshop_backend}
            MYSQL_USER: ${DEV_DB_USERNAME:-xshop}
            MYSQL_PASSWORD: ${DEV_DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
        ports:
            - "${BACKEND_MYSQL_PORT:-3308}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-bookworm
        restart: unless-stopped
        ports:
            - "${BACKEND_REDIS_PORT:-6378}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    mail:
        image: axllent/mailpit
        profiles:
            - mail
        restart: unless-stopped
        ports:
            - "${MAILPIT_PORT:-8025}:8025"

volumes:
    mysql-data:
    redis-data:
