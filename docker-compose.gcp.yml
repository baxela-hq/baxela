# GCP free-tier environment (backend only): tuned for a single e2-micro VM
# (1 GB RAM, 2 shared vCPU). Same images as the production stack, but:
#   - no admin/storefront containers (they live on Cloudflare Pages)
#   - no Redis: cache/queue/session use the database driver to save RAM
#   - MySQL tuned down (buffer pool, no performance_schema)
#   - per-service memory limits so one service cannot OOM the whole box
#   - persistent volume for storage/ so media uploads survive redeploys
#
# Run from the repo root:
#   docker compose --env-file .env.gcp -f docker-compose.gcp.yml up -d --build
#
# NOTE: a bare `docker compose up -d` (without -f) starts the DEVELOPMENT
# stack — always pass --env-file and -f for this environment.

name: baxela-gcp

x-backend: &backend
    image: baxela/backend:gcp
    build:
        context: .
        dockerfile: infrastructure/docker/production/backend/Dockerfile
    env_file: .env.gcp
    restart: unless-stopped
    mem_limit: 160m
    depends_on:
        mysql:
            condition: service_healthy
        migrate:
            condition: service_completed_successfully
    volumes:
        # Media uploads and framework caches outlive image rebuilds.
        # Named volumes are populated from the image on first mount, so the
        # storage/ skeleton is preserved on a fresh volume.
        - backend-storage:/var/www/html/storage

services:
    backend:
        <<: *backend

    backend-nginx:
        image: nginx:stable-bookworm
        restart: unless-stopped
        mem_limit: 48m
        ports:
            # Cloudflare (Flexible SSL) proxies HTTPS traffic to this port.
            - "${BACKEND_PORT:-80}:80"
        volumes:
            - ./infrastructure/docker/production/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - backend

    # One-shot: fpm/queue/scheduler wait for this to complete, so they never
    # race migrations against each other.
    migrate:
        <<: *backend
        command: php artisan migrate --force
        restart: "no"
        # Override the anchor's depends_on: migrate must not wait on itself.
        depends_on:
            mysql:
                condition: service_healthy

    queue:
        <<: *backend
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        mem_limit: 128m

    scheduler:
        <<: *backend
        command: php artisan schedule:work
        mem_limit: 128m

    mysql:
        image: mysql:8-debian
        restart: unless-stopped
        mem_limit: 480m
        # e2-micro sizing: small buffer pool, no performance_schema, few
        # connections — keeps MySQL around 350-400 MB resident.
        command:
            - --innodb-buffer-pool-size=128M
            - --performance-schema=OFF
            - --max-connections=25
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.gcp}
            MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.gcp}
            MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.gcp}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.gcp}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20
        # No published port: the DB is reachable only on the compose network.

volumes:
    mysql-data:
    backend-storage:
